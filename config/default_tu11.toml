# Analysis overrides for the campaign (default.xex) with Title Update #11 (version 0.0.11.8)
# Title ID 41560855. The input XEX is the one the runtime dumps after applying the TU
# (--bo1_dump_xex with default.xexp/default_mp.xexp in the game folder); see src/bo1_tu.cpp.
#
# Same criteria as config/default.toml (base version). Addresses change with the TU.

# --- PPC -> x64 translation (see config/default.toml) ---
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true

# --- setjmp/longjmp (tools/find_setjmp.py, verified) ---
