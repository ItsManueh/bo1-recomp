# Analysis overrides for default.xex (campaign + Zombies)
# Title ID 41560855, version 0.0.0.8
#
# Every entry documents WHY it is needed, so it can be reviewed later.
# Candidates come from tools/find_missing_funcs.py and are reviewed by hand:
# SEH blocks (__except/__finally using r31 as frame) are NOT added here.

# CRT setjmp/longjmp (tools/find_setjmp.py). The engine uses them in Com_Error to return
# to the main loop after a recoverable error; without declaring them the recompiled code cannot
# unwind the host stack and the game ends ("Execution complete") instead of recovering.
#   setjmp : saves f14-f31, r1 (+0x90), r13-r31, CR (+0x130), LR (+0x134) and VMX to r3
#   longjmp: r3 = jmp_buf, r4 = value; unwinds with 0x82603730 and restores
setjmp_address = 0x825FB540
longjmp_address = 0x825FB940

# --- PPC -> x64 translation ---
# Registers the generated code keeps in C++ local variables (PC CPU registers) instead of
# the in-memory ctx structure. Only the ones that are safe for this game:
#   skip_msr          : MSR was only used by the interrupt regions, already neutralized
#   ctr_as_local      : CTR (loop counter / bctr target) never survives a call
#   xer_as_local      : XER (carry/overflow) is volatile across calls
#   reserved_as_local : the lwarx/stwcx. reservation always starts and ends in the same function
#   cr_as_local       : condition registers
# non_volatile_as_local and skip_lr are NOT enabled: setjmp/longjmp (Com_Error) and the SEH blocks
# need r14-r31 and LR in ctx.
skip_msr = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true

